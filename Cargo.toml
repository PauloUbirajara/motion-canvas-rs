[package]
name = "motion-canvas-rs"
version = "0.2.3"
edition = "2021"
authors = ["Paulo Ubirajara"]
description = "A high-performance vector animation engine inspired by Motion Canvas, built on Vello and Typst."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/PauloUbirajara/motion-canvas-rs"
repository = "https://github.com/PauloUbirajara/motion-canvas-rs"
keywords = ["animation", "graphics", "vello", "typst", "vector"]
categories = ["graphics", "rendering", "multimedia"]
exclude = [
    ".github/*",
    "assets/*",
    "examples/audios/*",
    "examples/images/*",
    "run-tests.sh",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# By default, provide a working windowed environment
default = ["runtime"]

# GPU rendering and windowing
runtime = ["dep:vello", "dep:winit", "dep:indicatif"]

# Elements (rect, text, image, etc)
code = ["dep:syntect", "dep:similar"]
math = ["dep:typst"]
image = ["dep:image"]
audio = ["dep:rodio"]
svg = ["dep:usvg", "dep:vello_svg"]

# Export (requires GPU to render frames)
export = ["runtime", "image", "dep:serde_json"]

# Everything enabled
full = ["runtime", "code", "math", "image", "export", "svg", "audio", "physics"]

physics = ["dep:rapier2d"]

[dependencies]
glam = { version = "0.25", features = ["serde"] }
rayon = "1.11.0"
seahash = "4.1.0"
serde = { version = "1.0", features = ["derive"] }

# Core math and color re-exports (allowing headless use without full vello renderer)
peniko = "0.2"
kurbo = "0.11.1"

# --- System/Font Dependencies ---
skrifa = "0.22.3"
fontdb = "0.21.0"

# --- Optional Runtime Dependencies ---
vello = { version = "0.3.0", optional = true }
winit = { version = "0.29.15", optional = true }
indicatif = { version = "0.17", optional = true }

# --- Feature-Gated Elements ---
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
rodio = { version = "0.17", optional = true }
serde_json = { version = "1.0", optional = true }
similar = { version = "2.6.0", optional = true }
syntect = { version = "5.3.0", optional = true, features = [
    "regex-fancy",
    "default-themes",
    "parsing",
] }
typst = { version = "0.14.2", optional = true }
usvg = { version = "0.43.0", optional = true }
vello_svg = { version = "0.4.0", optional = true }
rapier2d = { version = "0.18.0", optional = true }

[profile.release]
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "advanced_flow"
required-features = ["runtime", "math", "code", "image", "svg"]

