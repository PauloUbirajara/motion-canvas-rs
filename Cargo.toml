[package]
name = "motion-canvas-rs"
version = "0.2.0"
edition = "2021"
authors = ["Paulo Ubirajara"]
description = "A high-performance vector animation engine inspired by Motion Canvas, built on Vello and Typst."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/PauloUbirajara/motion-canvas-rs"
repository = "https://github.com/PauloUbirajara/motion-canvas-rs"
keywords = ["animation", "graphics", "vello", "typst", "vector"]
categories = ["graphics", "rendering", "multimedia"]
exclude = [
    ".github/*",
    "assets/*",
    "examples/audios/*",
    "examples/images/*",
    "run-tests.sh",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# By default, provide a working windowed environment
default = ["runtime"]

# GPU rendering and windowing
runtime = ["dep:vello", "dep:winit", "dep:indicatif"]

# Elements (rect, text, image, etc)
code = ["dep:syntect", "dep:similar"]
math = ["dep:typst"]
image = ["dep:image"]
audio = ["dep:rodio"]
svg = ["dep:resvg", "dep:usvg"]

# Export (requires GPU to render frames)
export = ["runtime", "image", "dep:serde_json"]

# Everything enabled
full = ["runtime", "code", "math", "image", "export", "svg", "audio"]

[dependencies]
glam = "0.25"
rayon = "1.11.0"
seahash = "4.1.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.19"

# Core math and color re-exports (allowing headless use without full vello renderer)
peniko = "0.1"
kurbo = "0.11"

# --- Optional Runtime Dependencies ---
vello = { version = "0.2.1", optional = true }
winit = { version = "0.29", optional = true }
indicatif = { version = "0.17", optional = true }

# --- Feature-Gated Elements ---
image = { version = "0.24", optional = true }
resvg = { version = "0.45", optional = true }
rodio = { version = "0.17", optional = true }
serde_json = { version = "1.0", optional = true }
similar = { version = "2.6.0", optional = true }
syntect = { version = "5.3.0", optional = true }
typst = { version = "0.14.2", optional = true }
usvg = { version = "0.45", optional = true }

# --- System/Font Dependencies ---
font-kit = "0.14.3"
skrifa = "0.42.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "advanced_flow"
required-features = ["runtime", "math", "code", "image", "svg"]

[[example]]
name = "audio_demo"
required-features = ["runtime", "audio"]

[[example]]
name = "camera_demo"
required-features = ["runtime"]

[[example]]
name = "code_advanced"
required-features = ["runtime", "code"]

[[example]]
name = "code_animation"
required-features = ["runtime", "code"]

[[example]]
name = "color_interpolation"
required-features = ["runtime"]

[[example]]
name = "easing_scope"
required-features = ["runtime"]

[[example]]
name = "explainer"
required-features = ["runtime", "audio", "image", "code", "export", "svg"]

[[example]]
name = "export"
required-features = ["runtime", "export"]

[[example]]
name = "getting_started"
required-features = ["runtime"]

[[example]]
name = "grid"
required-features = ["runtime"]

[[example]]
name = "group_animation"
required-features = ["runtime"]

[[example]]
name = "images"
required-features = ["runtime", "image", "svg"]

[[example]]
name = "math_animation"
required-features = ["runtime", "math"]

[[example]]
name = "math_code"
required-features = ["runtime", "math", "code"]

[[example]]
name = "nested_cameras"
required-features = ["runtime"]

[[example]]
name = "news_feed"
required-features = ["runtime"]

[[example]]
name = "polygon"
required-features = ["runtime"]

[[example]]
name = "shapes"
required-features = ["runtime"]

[[example]]
